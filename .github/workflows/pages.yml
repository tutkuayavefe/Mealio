name: Deploy Mealio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site root
        env:
          SUPABASE_URL: ${{ vars.MEALIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.MEALIO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp src/app.js src/store.js src/cloud-client.js src/cloud-store.js _site/src/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = """// Generated by the Pages workflow. These values are public client config.\nexport const SUPABASE_URL = %s;\nexport const SUPABASE_PUBLISHABLE_KEY = %s;\n""" % (
              json.dumps(os.environ.get("SUPABASE_URL", "")),
              json.dumps(os.environ.get("SUPABASE_PUBLISHABLE_KEY", "")),
          )
          Path("_site/src/cloud-config.js").write_text(config, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
